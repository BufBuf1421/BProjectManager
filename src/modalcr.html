<!-- Модальное окно для создания проекта -->
<div id="createProjectModal" class="modal" style="display: none;">
  <div class="modal-content">
    <h2>📁 Создание проекта</h2>
    <p>Введите название нового проекта:</p>
    <input type="text" id="projectNameInput" placeholder="Название проекта..." />
    <div class="modal-actions">
      <button id="modalCancelBtn">Отмена</button>
      <button id="modalCreateBtn" class="btn-primary">Создать</button>
    </div>
  </div>
</div>
